<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página com Navbar e Sidebar Fixas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        /* Ajuste para compensar a navbar fixa */
        body {
            padding-top: 70px;
        }

        /* Sidebar fixa */
        #sidebar {
            width: 220px;
            min-height: 100vh;
            position: fixed;
            top: 50px; /* abaixo da navbar */
            left: 0;
        }

        /* Conteúdo principal com margem para não ficar atrás da sidebar */
        #conteudo {
            margin-left: 220px;
            overflow-y: auto;
            height: calc(100vh - 70px);
        }

        /* Links da sidebar */
        #sidebar .nav-link {
            padding: 10px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        
        #sidebar .nav-link:hover {
            background-color: #2980b9;
        }
        
        #sidebar .nav-link.active {
            background-color: #1f6391;
            font-weight: bold;
        }
        #navbarNav .nav-link:hover{
            background-color: #080b0c;
            font-weight: bold;
            border-radius: 12%;
            color: aliceblue;
        }
    </style>
</head>
<body>
  <!-- Navbar fixa -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="nav-link text-white active" href="index.html"><i class="bi bi-house-door-fill"></i> Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="cadastrar.html">T1</a></li>
                    <li class="nav-item"><a class="nav-link" href="tabela.html">T2</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <!-- Sidebar fixa -->
        <div class="bg-dark text-white p-3 position=fixed" id="sidebar">
        <h5 class="text-center">Menu</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" href="#">1º Trimestre</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="#">2º Trimestre</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="trimestre.html">3º Trimestre</a></li>
        </ul>
        </div>

        <!-- Conteúdo principal rolável -->
        <main class="p-4 flex-grow-1" id="conteudo">
            <h1>Olá seja bem vindo(a) as minhas tarefas</h1>
            <h3>Eu a Leila Pires e este é o meu sistema</h3>
            <p>Por favor!!, use a barra de menu para manunsear o sitema.</p>
            <hr>
            <p>Desenvolvido por Leila Pires</p>
            <small> <p><strong>leilapires269@gmail.com</strong></p></small>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
