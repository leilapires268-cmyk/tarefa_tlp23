<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Página com Navbar e Sidebar Fixas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <style>
        body {
            padding-top: 70px;
        }

        #sidebar {
            width: 220px;
            min-height: 100vh;
            position: fixed;
            top: 50px; 
            left: 0;
        }

   
        #conteudo {
            margin-left: 220px;
            overflow-y: auto;
            height: calc(100vh - 70px);
        }


        #sidebar .nav-link {
            padding: 10px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        
        #sidebar .nav-link:hover {
            background-color: #2980b9;
        }
        
        #sidebar .nav-link.active {
            background-color: #1f6391;
            font-weight: bold;
        }
        #navbarNav .nav-link:hover{
            background-color: #080b0c;
            font-weight: bold;
            border-radius: 12%;
            color: aliceblue;
        }
    </style>
</head>
<body>
  <!-- Navbar fixa -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container-fluid">
            <a class="nav-link text-white active" href="index.html"><i class="bi bi-house-door-fill"></i> Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="cadastrar.html">T1</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tabela.html">T2</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="d-flex">
        <!-- Sidebar fixa -->
        <div class="bg-dark text-white p-3 position=fixed" id="sidebar">
        <h5 class="text-center">Menu</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" href="#">1º Trimestre</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="#">2º Trimestre</a></li>
            <li class="nav-item"><a class="nav-link active text-white" href="#">3º Trimestre</a></li>
        </ul>
        </div>

        <!-- Conteúdo principal rolável -->
        <main class="p-4 flex-grow-1" id="conteudo">
            <h2>Tabela de Classificação do Aluno</h2>
            <table class="table table-bordered">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Número</th>
                        <th>Sala</th>
                        <th>Turma</th>
                        <th>Disciplina</th>
                        <th>Nota 1</th>
                        <th>Nota 2</th>
                        <th>Nota 3</th>
                        <th>Média</th>
                        <th>Classificação</th>
                    </tr>
                </thead>
                <tbody id="tabelaAluno"></tbody>
            </table>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
         const alunos = JSON.parse(localStorage.getItem("alunos")) || [];
        let html = "";

        alunos.forEach(aluno => {
            const media = ((aluno.nota1 + aluno.nota2 + aluno.nota3) / 3).toFixed(2);
            let classificacao = media >= 7 ? "Aprovado" : media >= 5 ? "Recuperação" : "Reprovado";

            html += `
            <tr>
                <td>${aluno.nome}</td>
                <td>${aluno.numeroAluno}</td>
                <td>${aluno.numeroSala}</td>
                <td>${aluno.turma}</td>
                <td>${aluno.disciplina}</td>
                <td>${aluno.nota1}</td>
                <td>${aluno.nota2}</td>
                <td>${aluno.nota3}</td>
                <td>${media}</td>
                <td>${classificacao}</td>
            </tr>
            `;
        });

        document.getElementById("tabelaAluno").innerHTML = html;
    </script>
</body>
</html>
